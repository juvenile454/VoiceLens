name: Feature request
description: Suggest an improvement to VoiceLens.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that VoiceLens does not support well?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04, GNOME 46, Wayland
